{% extends "store/base.html" %}
{% block title %}Сброс пароля — Swamp & Black{% endblock %}
{% block content %}
  <div class="section" style="max-width:480px;margin:0 auto">
    <h1>Восстановление пароля</h1>
    <p class="subtle">Введите ваш email. Мы пришлём ссылку для сброса пароля.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.email.label_tag }} {{ form.email }} {{ form.email.errors }}
      <div style="margin-top:12px"><button class="btn" type="submit">Отправить ссылку</button></div>
    </form>
  </div>
{% endblock %}
